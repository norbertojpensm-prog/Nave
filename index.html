<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Nave Trunks - Realidad Aumentada</title>


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    /* =========================================
       OCULTAR BOTÓN VR / AR DE A-FRAME
       ========================================= */

    .a-enter-vr,
    .a-enter-vr-button,
    .a-enter-ar,
    .a-enter-ar-button {

      display: none !important;

    }

  </style>

</head>


<body>


<a-scene

  mindar-image="imageTargetSrc: ./targets.mind;"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  renderer="colorManagement: true;"

>


  <!-- ========================================= -->
  <!-- MODELO 3D                                 -->
  <!-- ========================================= -->

  <a-assets>

    <a-asset-item
      id="nave"
      src="./nave_trunks.glb">
    </a-asset-item>

  </a-assets>



  <!-- ========================================= -->
  <!-- CÁMARA                                    -->
  <!-- ========================================= -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <!-- ========================================= -->
  <!-- IMAGEN OBJETIVO                           -->
  <!-- ========================================= -->

  <a-entity

    mindar-image-target="targetIndex: 0"

  >


    <!-- ======================================= -->
    <!-- NAVE TRUNKS                             -->
    <!-- ======================================= -->

    <a-gltf-model

      src="#nave"

      scale="0.0624 0.0624 0.0624"

      position="0 -0.90 0.08"

      rotation="0 0 0">

    </a-gltf-model>


  </a-entity>


</a-scene>


</body>

</html>
