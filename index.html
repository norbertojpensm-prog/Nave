<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Realidad Aumentada - Nave Trunks</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;
    }

  </style>

</head>


<body>


<a-scene

  mindar-image="imageTargetSrc: ./targets.mind;"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  renderer="colorManagement: true;"

>


  <!-- ============================================= -->
  <!-- RECURSOS                                      -->
  <!-- ============================================= -->

  <a-assets>

    <a-asset-item
      id="modelo3D"
      src="./nave_trunks.glb">
    </a-asset-item>

  </a-assets>



  <!-- ============================================= -->
  <!-- CÁMARA                                        -->
  <!-- ============================================= -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <!-- ============================================= -->
  <!-- IMAGEN OBJETIVO                               -->
  <!-- ============================================= -->

  <a-entity

    mindar-image-target="targetIndex: 0"

  >


    <!-- MODELO 3D -->

    <a-entity

      id="modelo"

      gltf-model="#modelo3D">

    </a-entity>


  </a-entity>


</a-scene>



<script>


  /*
  =====================================================
  CONFIGURACIÓN
  =====================================================

  MindAR considera:

  ancho de imagen objetivo = 1

  Nosotros queremos:

  ancho del modelo = 1.25

  Así el modelo sobresale ligeramente
  respecto de la imagen.
  */


  const ANCHO_MODELO = 1.25;


  /*
  Separación respecto de la superficie
  de la imagen.
  */

  const SEPARACION = 0.02;



  /*
  Obtenemos el modelo.
  */

  const modelo =
    document.querySelector("#modelo");



  /*
  Esperamos a que el GLB termine de cargar.
  */

  modelo.addEventListener(

    "model-loaded",

    () => {


      /*
      Obtenemos el objeto 3D interno.
      */

      const objeto3D =
        modelo.getObject3D("mesh");


      if (!objeto3D) {

        console.error(
          "No se pudo encontrar el modelo 3D."
        );

        return;

      }



      /*
      Actualizamos su geometría.
      */

      objeto3D.updateWorldMatrix(
        true,
        true
      );



      /*
      Creamos una caja invisible
      alrededor de todo el modelo.
      */

      const caja =
        new THREE.Box3().setFromObject(
          objeto3D
        );



      /*
      Calculamos sus dimensiones.
      */

      const tamano =
        new THREE.Vector3();


      caja.getSize(
        tamano
      );



      /*
      Calculamos el centro del modelo.
      */

      const centro =
        new THREE.Vector3();


      caja.getCenter(
        centro
      );



      /*
      Comprobamos que tenga
      un ancho válido.
      */

      if (
        !Number.isFinite(tamano.x) ||
        tamano.x <= 0
      ) {

        console.error(
          "El modelo tiene un ancho no válido."
        );

        return;

      }



      /*
      =====================================================
      ESCALA AUTOMÁTICA
      =====================================================

      Calculamos cuánto hay que escalarlo
      para que su ancho final sea 1.25.
      */

      const escala =
        ANCHO_MODELO / tamano.x;



      /*
      Aplicamos exactamente la misma escala
      a X, Y y Z.

      El modelo conserva sus proporciones.
      */

      modelo.object3D.scale.set(

        escala,
        escala,
        escala

      );



      /*
      =====================================================
      CENTRADO
      =====================================================
      */

      const posicionX =
        -centro.x * escala;


      const posicionY =
        -centro.y * escala;



      /*
      =====================================================
      COLOCAR MODELO ENCIMA DE LA IMAGEN
      =====================================================
      */

      const posicionZ =

        -(caja.min.z * escala)
        + SEPARACION;



      modelo.object3D.position.set(

        posicionX,
        posicionY,
        posicionZ

      );



      console.log(
        "Nave Trunks cargada correctamente."
      );


      console.log(
        "Ancho original:",
        tamano.x
      );


      console.log(
        "Ancho final:",
        ANCHO_MODELO
      );


      console.log(
        "Escala aplicada:",
        escala
      );


    }

  );



  /*
  Si el GLB no carga,
  aparecerá un error en consola.
  */

  modelo.addEventListener(

    "model-error",

    (error) => {

      console.error(
        "Error cargando nave_trunks.glb:",
        error
      );

    }

  );


</script>


</body>

</html>
