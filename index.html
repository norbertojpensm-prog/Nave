<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Modelo 3D - Realidad Aumentada</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

  </style>

</head>


<body>


<a-scene

  mindar-image="imageTargetSrc: ./targets.mind;"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

>


  <!-- MODELO 3D -->

  <a-assets>

    <a-asset-item
      id="modelo3D"
      src="./scene.gltf">
    </a-asset-item>

  </a-assets>



  <!-- CÁMARA -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <!-- IMAGEN OBJETIVO -->

  <a-entity
    mindar-image-target="targetIndex: 0">


    <!-- MODELO -->

    <a-entity
      id="modelo"
      gltf-model="#modelo3D">
    </a-entity>


  </a-entity>


</a-scene>



<script>

  /*
    La imagen objetivo de MindAR
    tiene un ancho de referencia = 1.

    Queremos que el modelo tenga
    un ancho final = 1.25.
  */

  const ANCHO_MODELO = 1.25;

  /*
    Pequeña separación respecto
    de la página.
  */

  const SEPARACION = 0.02;


  const modelo =
    document.querySelector("#modelo");


  modelo.addEventListener(
    "model-loaded",
    () => {


      /*
        Obtenemos el modelo 3D real.
      */

      const objeto3D =
        modelo.getObject3D("mesh");


      if (!objeto3D) {

        console.error(
          "No se pudo encontrar el modelo 3D."
        );

        return;

      }



      /*
        Actualizamos las coordenadas.
      */

      objeto3D.updateWorldMatrix(
        true,
        true
      );



      /*
        Calculamos los límites
        del modelo completo.
      */

      const caja =
        new THREE.Box3().setFromObject(
          objeto3D
        );


      const tamano =
        new THREE.Vector3();


      caja.getSize(
        tamano
      );


      const centro =
        new THREE.Vector3();


      caja.getCenter(
        centro
      );



      /*
        Calculamos la escala necesaria
        para que el ANCHO final sea 1.25.
      */

      const escala =
        ANCHO_MODELO / tamano.x;



      /*
        Aplicamos la misma escala
        en X, Y y Z para no deformarlo.
      */

      modelo.object3D.scale.set(

        escala,
        escala,
        escala

      );



      /*
        Centramos el modelo
        sobre la imagen.
      */

      const x =
        -centro.x * escala;


      const y =
        -centro.y * escala;



      /*
        Colocamos la parte inferior
        del modelo ligeramente encima
        de la imagen.
      */

      const z =
        -(caja.min.z * escala)
        + SEPARACION;



      modelo.object3D.position.set(

        x,
        y,
        z

      );


      console.log(
        "Modelo cargado correctamente."
      );


      console.log(
        "Ancho original:",
        tamano.x
      );


      console.log(
        "Ancho final:",
        ANCHO_MODELO
      );


    }
  );


  /*
    Si el GLTF no puede cargar,
    aparecerá el error en consola.
  */

  modelo.addEventListener(
    "model-error",
    (error) => {

      console.error(
        "Error cargando el modelo 3D:",
        error
      );

    }
  );


</script>


</body>

</html>
